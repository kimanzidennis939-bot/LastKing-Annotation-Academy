<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LastKing Annotation Academy</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --primary:#2563eb; --primary-light:#3b82f6; --accent:#8b5cf6; --accent-glow:#a78bfa;
  --bg-dark:#0b1120; --bg-card:#111827; --text-light:#f1f5f9; --text-muted:#94a3b8;
  --border-subtle:#1e293b; --success:#10b981; --error:#ef4444; --warning:#f59e0b;
  --transition:all 0.25s ease;
}
html { scroll-behavior:smooth; }
body {
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:var(--bg-dark); color:var(--text-light); line-height:1.5; min-height:100vh;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
body::before {
  content:''; position:fixed; top:-20%; left:-10%; width:60vw; height:60vw;
  background:radial-gradient(circle,rgba(37,99,235,0.12),transparent 70%);
  pointer-events:none; z-index:0;
}
body::after {
  content:''; position:fixed; bottom:-20%; right:-10%; width:50vw; height:50vw;
  background:radial-gradient(circle,rgba(139,92,246,0.1),transparent 70%);
  pointer-events:none; z-index:0;
}
svg { width:1em; height:1em; fill:currentColor; vertical-align:-0.125em; }

/* Views */
.view { display:none; }
.view.active { display:block; }

/* Buttons */
.btn {
  padding:0.5rem 1.25rem; border-radius:2rem; font-weight:500; font-size:0.9rem;
  cursor:pointer; transition:var(--transition); font-family:inherit;
  display:inline-flex; align-items:center; gap:0.4rem; justify-content:center; border:none;
}
.btn-primary {
  background:linear-gradient(135deg,var(--primary),var(--accent)); color:white;
  box-shadow:0 4px 14px rgba(59,130,246,0.3);
}
.btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(139,92,246,0.4); }
.btn-outline { border:1px solid var(--primary); color:white; background:transparent; }
.btn-outline:hover { background:var(--primary); box-shadow:0 0 20px rgba(59,130,246,0.3); }
.btn-large { padding:0.9rem 2rem; font-size:1rem; border-radius:3rem; }

/* Logo */
.logo {
  display:inline-flex; align-items:center; gap:0.6rem; font-weight:700; font-size:1.35rem;
  cursor:pointer; text-decoration:none; color:inherit;
}
.logo-icon {
  background:linear-gradient(135deg,var(--primary),var(--accent));
  width:2.4rem; height:2.4rem; display:flex; align-items:center; justify-content:center;
  border-radius:12px; font-size:1.2rem; box-shadow:0 0 15px rgba(139,92,246,0.4);
  color:white; flex-shrink:0;
}
.logo span { color:white; }
.logo-dot { color:#a78bfa; }

/* Container */
.container { width:100%; max-width:1280px; margin:0 auto; padding:0 1.25rem; }

/* Navbar */
.navbar {
  background:rgba(11,17,32,0.85); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border-subtle); padding:0.9rem 0; position:sticky; top:0; z-index:100;
}
.nav-container {
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap;
  gap:0.8rem 1rem; max-width:1280px; margin:0 auto; padding:0 1.25rem;
}
.nav-links { display:flex; align-items:center; gap:1.5rem; font-weight:500; color:var(--text-muted); }
.nav-links a { text-decoration:none; color:inherit; font-size:0.95rem; transition:var(--transition); cursor:pointer; }
.nav-links a:hover { color:white; }
.nav-actions { display:flex; gap:0.8rem; align-items:center; }

/* Hero */
.hero { padding:4rem 0 3rem; }
.hero-content { display:flex; flex-direction:column; align-items:center; text-align:center; gap:1.5rem; }
.badge {
  background:rgba(59,130,246,0.15); border:1px solid rgba(59,130,246,0.3);
  padding:0.4rem 1.2rem; border-radius:3rem; font-size:0.85rem; font-weight:500;
  color:var(--primary-light); display:inline-flex; align-items:center; gap:0.5rem;
}
.hero h1 {
  font-size:clamp(2rem,6vw,3.8rem); font-weight:800; line-height:1.15; max-width:950px;
  background:linear-gradient(to right,#ffffff,#bfdbfe,#c4b5fd);
  -webkit-background-clip:text; background-clip:text; color:transparent; margin-top:0.5rem;
}
.tagline {
  font-size:clamp(1rem,3vw,1.25rem); color:var(--text-muted); display:flex;
  flex-wrap:wrap; justify-content:center; gap:0.5rem 1.2rem;
}
.hero-actions { display:flex; flex-wrap:wrap; gap:1rem; justify-content:center; margin:1rem 0 0.5rem; }
.stats-mini {
  display:flex; flex-wrap:wrap; justify-content:center; gap:1.2rem 2.5rem;
  margin-top:2rem; color:var(--text-muted); font-size:0.9rem;
}
.stats-mini strong { color:white; font-size:1.2rem; display:block; font-weight:700; }
.hero-desc { color:var(--text-muted); max-width:700px; font-size:1.1rem; }

/* Section headings */
.section-title {
  font-size:2rem; font-weight:700; margin-bottom:0.75rem;
  background:linear-gradient(to right,#fff,#a5b4fc);
  -webkit-background-clip:text; background-clip:text; color:transparent; display:inline-block;
}
.section-sub { color:var(--text-muted); max-width:700px; font-size:1.05rem; margin-bottom:2.5rem; }

/* Role cards (landing) */
.roles-grid {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:1.8rem; margin:2rem 0 1rem;
}
.role-card-landing {
  background:var(--bg-card); border:1px solid var(--border-subtle); border-radius:1.5rem;
  padding:2rem 1.6rem; transition:var(--transition); position:relative; overflow:hidden;
}
.role-card-landing:hover { border-color:var(--primary); transform:translateY(-4px); box-shadow:0 20px 30px -15px rgba(0,0,0,0.5); }
.role-card-landing::before {
  content:''; position:absolute; top:0; left:0; width:100%; height:4px;
  background:linear-gradient(90deg,var(--primary),var(--accent));
}
.role-icon-lg {
  font-size:1.8rem; background:rgba(59,130,246,0.15); width:3.5rem; height:3.5rem;
  display:flex; align-items:center; justify-content:center; border-radius:1.2rem;
  margin-bottom:1.5rem; color:var(--primary-light);
}
.role-card-landing h3 { font-size:1.4rem; margin-bottom:0.5rem; }
.role-card-landing p { color:var(--text-muted); font-size:0.95rem; margin-bottom:1.5rem; }
.role-features { list-style:none; display:flex; flex-direction:column; gap:0.6rem; font-size:0.9rem; color:#cbd5e1; }
.role-features li { display:flex; align-items:center; gap:0.5rem; }
.role-features svg { color:var(--success); flex-shrink:0; }

/* Chips */
.chips-row { display:flex; flex-wrap:wrap; gap:0.7rem 1rem; margin:2.5rem 0 1.5rem; justify-content:center; }
.chip {
  background:rgba(255,255,255,0.04); border:1px solid var(--border-subtle);
  padding:0.6rem 1.2rem; border-radius:2.5rem; font-size:0.9rem;
  display:flex; align-items:center; gap:0.5rem; transition:var(--transition);
}
.chip svg { color:var(--accent-glow); }
.chip:hover { background:rgba(59,130,246,0.1); border-color:var(--primary); }

/* CTA Banner */
.cta-banner {
  background:linear-gradient(135deg,#1e3a8a,#4c1d95); border-radius:2rem;
  padding:2.8rem 2rem; margin:3rem 0 2rem; text-align:center;
  display:flex; flex-direction:column; align-items:center; gap:1.2rem;
  box-shadow:0 25px 40px -15px rgba(0,0,0,0.5);
}
.cta-banner h2 { font-size:clamp(1.8rem,4vw,2.5rem); font-weight:700; }
.cta-banner p { color:#dbeafe; max-width:650px; font-size:1.05rem; }

/* Footer */
footer { border-top:1px solid var(--border-subtle); padding:2.5rem 0; margin-top:3rem; color:var(--text-muted); font-size:0.9rem; }
.footer-content { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:1.5rem; }
.footer-links { display:flex; flex-wrap:wrap; gap:1.5rem; }
.footer-links a { color:inherit; text-decoration:none; cursor:pointer; }
.footer-links a:hover { color:white; }

/* Auth layout */
.auth-wrapper { min-height:100vh; display:grid; grid-template-columns:1fr 1.15fr; position:relative; z-index:1; }
.brand-panel {
  padding:3rem 4rem; display:flex; flex-direction:column; justify-content:space-between;
  background:linear-gradient(160deg,#0b1120 0%,#111c34 100%);
  position:relative; overflow:hidden;
}
.brand-panel::before {
  content:''; position:absolute; inset:0;
  background-image:
    radial-gradient(circle at 20% 30%,rgba(59,130,246,0.15) 0%,transparent 40%),
    radial-gradient(circle at 80% 70%,rgba(139,92,246,0.15) 0%,transparent 40%);
  pointer-events:none;
}
.brand-top { position:relative; z-index:1; }
.brand-hero { position:relative; z-index:1; }
.brand-hero h1 {
  font-size:clamp(1.8rem,3.5vw,2.6rem); font-weight:800; line-height:1.2; margin-bottom:1.2rem;
  background:linear-gradient(to right,#ffffff,#bfdbfe,#c4b5fd);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.brand-hero p { color:var(--text-muted); font-size:1.05rem; max-width:420px; margin-bottom:2rem; }
.brand-features { list-style:none; display:flex; flex-direction:column; gap:1rem; margin-top:1rem; }
.brand-features li { display:flex; align-items:center; gap:0.9rem; color:#cbd5e1; font-size:0.95rem; }
.feat-icon {
  width:2.2rem; height:2.2rem; background:rgba(59,130,246,0.12);
  border:1px solid rgba(59,130,246,0.25); border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  color:var(--primary-light); font-size:0.9rem; flex-shrink:0;
}
.brand-footer {
  position:relative; z-index:1; color:var(--text-muted); font-size:0.85rem;
  display:flex; align-items:center; gap:0.5rem;
}

.form-panel { padding:3rem 4rem; display:flex; flex-direction:column; justify-content:center; align-items:center; }
.form-container { width:100%; max-width:480px; }
.back-link {
  display:inline-flex; align-items:center; gap:0.4rem; color:var(--text-muted);
  font-size:0.85rem; margin-bottom:1.5rem; transition:var(--transition);
  background:none; border:none; cursor:pointer; font-family:inherit; padding:0;
}
.back-link:hover { color:var(--primary-light); }
.form-header { margin-bottom:1.8rem; }
.form-header h2 { font-size:1.9rem; font-weight:700; margin-bottom:0.4rem; color:white; }
.form-header p { color:var(--text-muted); font-size:0.95rem; }
.form-header p a { color:var(--primary-light); font-weight:600; cursor:pointer; }
.form-header p a:hover { color:var(--accent-glow); text-decoration:underline; }

/* Role selector (compact) */
.role-selector { display:grid; grid-template-columns:repeat(3,1fr); gap:0.6rem; margin-bottom:1.8rem; }
.role-option { position:relative; cursor:pointer; }
.role-option input { position:absolute; opacity:0; pointer-events:none; }
.role-option-inner {
  display:flex; flex-direction:column; align-items:center; gap:0.4rem;
  padding:0.9rem 0.4rem; background:var(--bg-card);
  border:1.5px solid var(--border-subtle); border-radius:14px;
  transition:var(--transition); text-align:center;
}
.role-option-inner svg { font-size:1.2rem; color:var(--text-muted); }
.role-option-inner span { font-size:0.72rem; font-weight:600; color:var(--text-muted); }
.role-option input:checked + .role-option-inner {
  border-color:var(--primary); background:rgba(37,99,235,0.1);
  box-shadow:0 0 0 3px rgba(37,99,235,0.12);
}
.role-option input:checked + .role-option-inner svg { color:var(--primary-light); }
.role-option input:checked + .role-option-inner span { color:white; }
.role-label {
  font-size:0.8rem; font-weight:600; color:var(--text-muted);
  text-transform:uppercase; letter-spacing:0.06em; margin-bottom:0.7rem; display:block;
}

/* Fields */
.field { margin-bottom:1.1rem; }
.field label { display:block; font-size:0.85rem; font-weight:500; color:#cbd5e1; margin-bottom:0.5rem; }
.field label .req { color:var(--error); margin-left:2px; }
.input-wrap { position:relative; display:flex; align-items:center; }
.input-wrap .field-icon {
  position:absolute; left:1rem; color:var(--text-muted); font-size:1rem;
  pointer-events:none; transition:var(--transition); display:flex;
}
.input-wrap input, .input-wrap select {
  width:100%; padding:0.85rem 1rem 0.85rem 2.7rem;
  background:var(--bg-card); border:1.5px solid var(--border-subtle);
  border-radius:12px; color:white; font-size:0.95rem; font-family:inherit;
  transition:var(--transition); outline:none; appearance:none;
}
.input-wrap select { cursor:pointer; }
.input-wrap select option { background:#0f172a; color:white; }
.input-wrap input::placeholder { color:#64748b; }
.input-wrap input:focus, .input-wrap select:focus {
  border-color:var(--primary); background:#0f1929;
  box-shadow:0 0 0 3px rgba(37,99,235,0.15);
}
.input-wrap input.error, .input-wrap select.error {
  border-color:var(--error); background:rgba(239,68,68,0.05);
}
.select-arrow {
  position:absolute; right:1rem; color:var(--text-muted);
  font-size:0.75rem; pointer-events:none;
}
.toggle-password {
  position:absolute; right:1rem; background:transparent; border:none;
  color:var(--text-muted); cursor:pointer; font-size:1rem; padding:0.3rem;
  transition:var(--transition); display:flex; align-items:center; justify-content:center;
}
.toggle-password:hover { color:var(--primary-light); }

.field-error {
  display:none; color:var(--error); font-size:0.78rem;
  margin-top:0.4rem; align-items:center; gap:0.35rem;
}
.field-error.visible { display:flex; }

.field-row { display:grid; grid-template-columns:1fr 1fr; gap:0.9rem; }

/* Checkbox */
.checkbox-wrap { display:flex; align-items:flex-start; gap:0.7rem; cursor:pointer; user-select:none; margin-bottom:1rem; }
.checkbox-wrap input { position:absolute; opacity:0; pointer-events:none; }
.checkbox-box {
  width:1.15rem; height:1.15rem; border:1.5px solid #334155;
  border-radius:6px; background:var(--bg-card);
  display:flex; align-items:center; justify-content:center;
  transition:var(--transition); flex-shrink:0; margin-top:0.15rem;
}
.checkbox-box svg { font-size:0.7rem; color:white; opacity:0; transform:scale(0.6); transition:var(--transition); }
.checkbox-wrap input:checked + .checkbox-box { background:var(--primary); border-color:var(--primary); }
.checkbox-wrap input:checked + .checkbox-box svg { opacity:1; transform:scale(1); }
.checkbox-wrap span.check-label { font-size:0.85rem; color:#cbd5e1; line-height:1.5; }
.checkbox-wrap span.check-label a { color:var(--primary-light); font-weight:600; cursor:pointer; }
.checkbox-wrap span.check-label a:hover { text-decoration:underline; }

.form-options {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:1.6rem; flex-wrap:wrap; gap:0.7rem;
}
.forgot-link {
  font-size:0.85rem; color:var(--primary-light); font-weight:500;
  cursor:pointer; background:none; border:none; font-family:inherit; padding:0;
}
.forgot-link:hover { color:var(--accent-glow); text-decoration:underline; }

.btn-row { display:flex; gap:0.8rem; margin-top:1.5rem; }
.btn-secondary {
  background:var(--bg-card); color:#cbd5e1;
  border:1.5px solid var(--border-subtle);
  padding:0.85rem 1.25rem; border-radius:12px; font-weight:600;
  font-family:inherit; cursor:pointer; font-size:0.9rem;
  transition:var(--transition);
  display:flex; align-items:center; justify-content:center; gap:0.5rem;
}
.btn-secondary:hover { border-color:#334155; background:#131c31; color:white; }

.btn-submit {
  width:100%; padding:0.95rem 1.5rem;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  border:none; border-radius:12px; color:white;
  font-size:0.98rem; font-weight:600; font-family:inherit; cursor:pointer;
  transition:var(--transition); display:flex; align-items:center;
  justify-content:center; gap:0.6rem;
  box-shadow:0 6px 20px -5px rgba(59,130,246,0.5);
}
.btn-submit:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 10px 28px -5px rgba(139,92,246,0.55); }
.btn-submit:disabled { opacity:0.7; cursor:not-allowed; }

.spinner {
  width:1rem; height:1rem; border:2px solid rgba(255,255,255,0.3);
  border-top-color:white; border-radius:50%;
  animation:spin 0.7s linear infinite; display:none;
}
.loading .spinner { display:block; }
.loading .btn-text { opacity:0.7; }
@keyframes spin { to { transform:rotate(360deg); } }

/* Alerts */
.alert {
  display:none; align-items:flex-start; gap:0.7rem; padding:0.9rem 1rem;
  border-radius:12px; font-size:0.85rem; margin-bottom:1.4rem;
  line-height:1.45; animation:slideDown 0.3s ease;
}
.alert.visible { display:flex; }
.alert.error { background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); color:#fca5a5; }
.alert.success { background:rgba(16,185,129,0.1); border:1px solid rgba(16,185,129,0.3); color:#6ee7b7; }
.alert.info { background:rgba(59,130,246,0.1); border:1px solid rgba(59,130,246,0.3); color:#93c5fd; }
.alert svg { flex-shrink:0; margin-top:0.15rem; font-size:1rem; }
@keyframes slideDown { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }

/* Divider + social */
.divider {
  display:flex; align-items:center; gap:1rem; margin:1.5rem 0;
  color:var(--text-muted); font-size:0.8rem;
}
.divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--border-subtle); }
.social-row { display:grid; grid-template-columns:1fr 1fr; gap:0.8rem; }
.btn-social {
  display:flex; align-items:center; justify-content:center; gap:0.6rem;
  padding:0.75rem 1rem; background:var(--bg-card);
  border:1.5px solid var(--border-subtle); border-radius:12px;
  color:#cbd5e1; font-size:0.9rem; font-weight:500;
  font-family:inherit; cursor:pointer; transition:var(--transition);
}
.btn-social:hover { border-color:#334155; background:#131c31; color:white; }

/* Password strength */
.strength-meter { display:flex; gap:4px; margin-top:0.5rem; }
.strength-seg { flex:1; height:4px; background:var(--border-subtle); border-radius:4px; transition:var(--transition); }
.strength-seg.weak { background:var(--error); }
.strength-seg.fair { background:var(--warning); }
.strength-seg.good { background:#3b82f6; }
.strength-seg.strong { background:var(--success); }
.strength-text {
  font-size:0.72rem; color:var(--text-muted); margin-top:0.35rem;
  display:flex; justify-content:space-between;
}

/* Multi-step */
.progress-bar { height:4px; background:var(--border-subtle); border-radius:10px; overflow:hidden; margin-bottom:1.8rem; display:none; }
.progress-bar.visible { display:block; }
.progress-fill {
  height:100%; background:linear-gradient(90deg,var(--primary),var(--accent));
  border-radius:10px; transition:width 0.35s ease; width:25%;
}
.step-panel { display:none; animation:fadeIn 0.3s ease; }
.step-panel.active { display:block; }
@keyframes fadeIn { from { opacity:0; transform:translateX(10px); } to { opacity:1; transform:translateX(0); } }

.role-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:0.8rem; margin-bottom:1.5rem; }
.role-card { position:relative; cursor:pointer; }
.role-card input { position:absolute; opacity:0; pointer-events:none; }
.role-card-inner {
  padding:1.4rem 0.9rem; background:var(--bg-card);
  border:1.5px solid var(--border-subtle); border-radius:16px;
  text-align:center; transition:var(--transition);
  display:flex; flex-direction:column; align-items:center; gap:0.6rem; height:100%;
}
.role-card-inner .role-ic { font-size:1.5rem; color:var(--text-muted); display:flex; }
.role-card-inner h4 { font-size:0.9rem; font-weight:700; color:#cbd5e1; }
.role-card-inner p { font-size:0.72rem; color:var(--text-muted); line-height:1.35; }
.role-card input:checked + .role-card-inner {
  border-color:var(--primary); background:rgba(37,99,235,0.1);
  box-shadow:0 0 0 3px rgba(37,99,235,0.12);
}
.role-card input:checked + .role-card-inner .role-ic { color:var(--primary-light); }
.role-card input:checked + .role-card-inner h4 { color:white; }

/* Success screen */
.success-screen { text-align:center; padding:2rem 0; animation:fadeIn 0.4s ease; }
.success-icon {
  width:5rem; height:5rem; margin:0 auto 1.5rem; border-radius:50%;
  background:linear-gradient(135deg,var(--success),#059669);
  display:flex; align-items:center; justify-content:center;
  font-size:2.2rem; color:white;
  box-shadow:0 0 30px rgba(16,185,129,0.5);
  animation:popIn 0.5s ease;
}
@keyframes popIn {
  0% { transform:scale(0.5); opacity:0; }
  60% { transform:scale(1.08); }
  100% { transform:scale(1); opacity:1; }
}
.success-screen h2 {
  font-size:1.7rem; font-weight:700; margin-bottom:0.7rem;
  background:linear-gradient(to right,#ffffff,#a5b4fc);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.success-screen p { color:var(--text-muted); font-size:0.95rem; margin-bottom:1.8rem; max-width:400px; margin-left:auto; margin-right:auto; }

/* Dashboard */
.dashboard { min-height:100vh; padding:2rem 0; position:relative; z-index:1; }
.dashboard-inner { max-width:1100px; margin:0 auto; padding:0 1.25rem; }
.dashboard-header {
  display:flex; justify-content:space-between; align-items:center;
  flex-wrap:wrap; gap:1rem; margin-bottom:2rem; padding:1.5rem;
  background:var(--bg-card); border:1px solid var(--border-subtle); border-radius:1.5rem;
}
.dashboard-user { display:flex; align-items:center; gap:1rem; }
.avatar {
  width:3.5rem; height:3.5rem; border-radius:50%;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  display:flex; align-items:center; justify-content:center;
  font-size:1.3rem; font-weight:700; color:white;
}
.dashboard-user h3 { font-size:1.1rem; margin-bottom:0.15rem; }
.dashboard-user p { font-size:0.85rem; color:var(--text-muted); }
.role-badge {
  display:inline-block; padding:0.2rem 0.7rem;
  background:rgba(139,92,246,0.15); border:1px solid rgba(139,92,246,0.3);
  border-radius:20px; font-size:0.7rem; color:var(--accent-glow);
  font-weight:600; text-transform:uppercase; letter-spacing:0.05em;
  margin-left:0.5rem;
}
.dashboard-grid {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:1.2rem;
}
.dash-card {
  background:var(--bg-card); border:1px solid var(--border-subtle);
  border-radius:1.2rem; padding:1.5rem; transition:var(--transition);
}
.dash-card:hover { border-color:var(--primary); transform:translateY(-3px); }
.dash-card svg { font-size:1.8rem; color:var(--accent-glow); margin-bottom:0.8rem; }
.dash-card h4 { font-size:1rem; margin-bottom:0.4rem; }
.dash-card p { font-size:0.85rem; color:var(--text-muted); }

.cloud-status {
  display:inline-flex; align-items:center; gap:0.5rem;
  font-size:0.75rem; color:var(--text-muted); margin-top:1rem;
}
.cloud-status .dot {
  width:8px; height:8px; border-radius:50%;
  background:var(--success); box-shadow:0 0 8px var(--success);
  animation:pulse 2s infinite;
}
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

/* Responsive */
@media (max-width:1024px) {
  .auth-wrapper { grid-template-columns:1fr; }
  .brand-panel { padding:2rem; }
  .brand-features { display:none; }
  .trust-row { display:none; }
  .form-panel { padding:2rem; }
  .nav-links { display:none; }
  .nav-actions { gap:0.5rem; }
}
@media (max-width:640px) {
  .brand-panel { padding:1.75rem 1.25rem; }
  .brand-hero h1 { font-size:1.5rem; }
  .brand-hero p { font-size:0.9rem; }
  .form-panel { padding:1.75rem 1.25rem; }
  .form-header h2 { font-size:1.55rem; }
  .role-grid { gap:0.5rem; }
  .role-card-inner { padding:1rem 0.5rem; }
  .role-card-inner p { display:none; }
  .field-row { grid-template-columns:1fr; gap:0; }
  .social-row { grid-template-columns:1fr; }
  .dashboard { padding:1.25rem 0; }
  .footer-content { justify-content:center; text-align:center; }
}
</style>
